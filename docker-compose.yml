services:

  ingest-catalog:
    build:
      context: ./data-pipeline/ingest-catalog
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-hardtech_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-hardtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hardtech}

      S3_BUCKET: ${S3_BUCKET_REAL:-hardtechhub-bucket}

    networks:
      - hardtech-net


  ingest-inventory:
    build:
      context: ./data-pipeline/ingest-inventory
    env_file:
      - .env
    environment:
      INVENTORY_MONGO_URI: ${INVENTORY_MONGO_URI}
      INVENTORY_MONGO_DB: ${INVENTORY_MONGO_DB:-hardtech_inventory}

      S3_BUCKET: ${S3_BUCKET_REAL:-hardtechhub-bucket}
      S3_PREFIX: db-extracts/inventory

    networks:
      - hardtech-net


  ingest-order:
    build:
      context: ./data-pipeline/ingest-order
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hardtech_orders}
      MYSQL_USER: ${MYSQL_USER:-hardtech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hardtech}

      S3_BUCKET: ${S3_BUCKET_REAL:-hardtechhub-bucket}

    networks:
      - hardtech-net


networks:
  hardtech-net:
    driver: bridge
