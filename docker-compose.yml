services:
  ingest-catalog:
    build:
      context: ./data-pipeline/ingest-catalog
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-hardtech_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-hardtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hardtech}
      S3_BUCKET: ${S3_BUCKET_REAL:-hardtechhub-bucket}
    networks:
      - hardtech-net

  ingest-identity:
    build:
      context: ./data-pipeline/ingest-identity
    env_file:
      - .env
    environment:
      # DYNAMODB_ENDPOINT se deja vacio a proposito: sin valor, el codigo
      # usa el endpoint REAL de AWS DynamoDB (no LocalStack). Solo se
      # define aqui si en algun momento se quiere apuntar a LocalStack.
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}
      DYNAMODB_REGION: ${DYNAMODB_REGION:-us-east-1}
      USERS_TABLE: ${USERS_TABLE:-users}
      S3_BUCKET: ${S3_BUCKET_REAL:-hardtechhub-bucket}
    networks:
      - hardtech-net

  ingest-order:
    build:
      context: ./data-pipeline/ingest-order
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hardtech_orders}
      MYSQL_USER: ${MYSQL_USER:-hardtech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hardtech}
      S3_BUCKET: ${S3_BUCKET_REAL:-hardtechhub-bucket}
    networks:
      - hardtech-net

networks:
  hardtech-net:
    driver: bridge
